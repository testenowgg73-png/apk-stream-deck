plugins { id 'com.android.application' }

android {
    namespace 'com.ultron.streamdeck'
    compileSdk 33
    defaultConfig {
        applicationId 'com.ultron.streamdeck'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
