name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Montar projeto Android
        run: |
          mkdir -p Android/app/src/main/java/com/ultron/streamdeck
          mkdir -p Android/app/src/main/res/values
          cp settings.gradle Android/settings.gradle
          cp gradle.properties Android/gradle.properties
          cp AndroidManifest.xml Android/app/src/main/AndroidManifest.xml
          cp styles.xml Android/app/src/main/res/values/styles.xml
          cp MainActivity.java Android/app/src/main/java/com/ultron/streamdeck/MainActivity.java
          cat > Android/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF2
          cat > Android/app/build.gradle <<'EOF2'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ultron.streamdeck'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.ultron.streamdeck'
                  minSdk 17
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF2
          find Android -type f
      - name: Compilar APK
        working-directory: Android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-StreamDeck-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
