name: Build EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name ULTRON_PC ultron_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: ULTRON-PC-exe
          path: dist/ULTRON_PC.exe
